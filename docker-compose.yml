services:
  postgres:
    image: postgres:16-alpine
    container_name: anchorhook-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: anchorhook
      POSTGRES_PASSWORD: anchorhook
      POSTGRES_DB: anchorhook
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U anchorhook"]
      interval: 5s
      timeout: 5s
      retries: 5

  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: anchorhook-rabbitmq
    restart: unless-stopped
    ports:
      - "5672:5672"
      - "15672:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "check_port_connectivity"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build: ./api
    container_name: anchorhook-api
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: postgres://anchorhook:anchorhook@postgres:5432/anchorhook
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672
      PORT: 3000
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    volumes:
      - ./api:/app
      - /app/node_modules

  worker:
    build: ./api
    container_name: anchorhook-worker
    restart: unless-stopped
    command: node worker.js
    environment:
      DATABASE_URL: postgres://anchorhook:anchorhook@postgres:5432/anchorhook
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    volumes:
      - ./api:/app
      - /app/node_modules

  mock-receiver:
    build: ./mock-receiver
    container_name: anchorhook-mock-receiver
    restart: unless-stopped
    ports:
      - "4000:4000"
    environment:
      WEBHOOK_SECRET: "d1414ccc7556e411ff1a276baa1906a8fd5cade7eff6fca83e6e1d02f96018d9"
      FORCE_FAIL: "false"
    volumes:
      - ./mock-receiver:/app
      - /app/node_modules

volumes:
  pgdata:

