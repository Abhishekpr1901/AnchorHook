version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    container_name: anchorhook-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: anchorhook
      POSTGRES_PASSWORD: anchorhook
      POSTGRES_DB: anchorhook
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U anchorhook"]
      interval: 5s
      timeout: 5s
      retries: 5

  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: anchorhook-rabbitmq
    restart: unless-stopped
    ports:
      - "5672:5672"
      - "15672:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "check_port_connectivity"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build: ./api
    container_name: anchorhook-api
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: postgres://anchorhook:anchorhook@postgres:5432/anchorhook
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672
      PORT: 3000
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    volumes:
      - ./api:/app
      - /app/node_modules

volumes:
  pgdata:


# ─────────────────────────────────────────────
# NOTES — Milestone 1
# ─────────────────────────────────────────────
# This file defines and connects 3 services: postgres, rabbitmq, api.
# Running `docker compose up` starts all of them together, networked,
# so `api` can reach `postgres` and `rabbitmq` just by hostname (no IP needed).
#
# - depends_on + condition: service_healthy
#   Without this, Docker only waits for a container to START, not to be
#   READY. Postgres can "start" before it's actually accepting connections,
#   which would crash the api on its first query. The healthcheck fixes this.
#
# - volumes: pgdata:/var/lib/postgresql/data
#   Without this, Postgres data lives INSIDE the container and gets wiped
#   every time the container is removed (docker compose down). This volume
#   stores the data outside the container so it survives restarts.
#
# - volumes: ./api:/app
#   Without this, code changes wouldn't show up inside the running
#   container until a full rebuild. This live-mounts local code into the
#   container so edits reflect immediately.
#
# - ports: "5672" (AMQP, used by our app) vs "15672" (RabbitMQ's web
#   management UI — useful later for visually watching queues/DLQ).